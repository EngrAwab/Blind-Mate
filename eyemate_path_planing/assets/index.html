<!DOCTYPE html>
<html>
<head>
    <title>Safe Path Finder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <style>
        body { background: #222; color: white; text-align: center; font-family: sans-serif; margin-top: 50px; }
        img { border: 4px solid #00d2ff; border-radius: 12px; width: 640px; height: 480px; }
    </style>
</head>
<body>
    <h1>Safe Path Finder</h1>
    <img id="video_feed" src="" alt="Waiting for camera feed...">

        <script>
        const socket = io();

        // Catch the base64 text string
        socket.on('relay_frame', (b64_str) => {
            // Plug it directly into the image!
            document.getElementById('video_feed').src = "data:image/jpeg;base64," + b64_str;
        });
    </script>
</body>
</html>
